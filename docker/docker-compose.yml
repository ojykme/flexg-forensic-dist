version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ${BRAND_PREFIX:-flexg}_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-flexg_forensic}
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-flexg_forensic}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ${BRAND_PREFIX:-flexg}_redis
    volumes:
      - ../data/redis:/data
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ${BRAND_PREFIX:-flexg}_api
    volumes:
      - ../bin:/app/bin
      - ../logs/api:/app/logs
      - ../app/templates:/app/app/templates
    environment:
      - PYTHONPATH=/app:/app/bin
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ${BRAND_PREFIX:-flexg}_worker
    volumes:
      - ../bin:/app/bin
      - ../logs/worker:/app/logs
    environment:
      - PYTHONPATH=/app:/app/bin
    env_file:
      - ../.env
    depends_on:
      - db
      - redis
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "-P", "solo"]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: ${BRAND_PREFIX:-flexg}_proxy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ../frontend/static:/var/www/static
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - ../.env
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
