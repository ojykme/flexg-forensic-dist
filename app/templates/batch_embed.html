<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ brand_ui_name }} | Batch Forensic Embedder</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/batch.css">
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">{{ brand_ui_name }} BATCH EMBEDDER</div>
            <div class="subtitle">Elite Multi-Asset Forensic Provisioning</div>
        </header>

        <!-- Config Panel -->
        <div class="config-panel">
            <div class="input-group">
                <label>Master API Key / 마스터 키</label>
                <input type="password" id="api-key" placeholder="flexg_...">
            </div>
            <div class="input-group">
                <label>Partner Asset ID / 자산 그룹 ID</label>
                <input type="text" id="asset-id" placeholder="e.g. STO-2024-MAY">
            </div>
            <div class="input-group">
                <label>Optimization / 최적화</label>
                <select id="optimize">
                    <option value="true">Enable (WebP/AVIF)</option>
                    <option value="false">Disable (Original Format)</option>
                </select>
            </div>
        </div>

        <!-- Drop Zone -->
        <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
            <span class="icon">📁</span>
            <p>Click or Drag images here (Max 10)</p>
            <span style="font-size: 12px; color: var(--text-secondary); margin-top: 10px; display: block;">Supports: JPG, PNG, WEBP, AVIF</span>
            <input type="file" id="file-input" multiple accept="image/*" style="display: none" onchange="handleFileSelect(event)">
        </div>

        <!-- Batch List -->
        <div id="batch-container" class="batch-list">
            <!-- Items will be added here -->
        </div>

        <button id="start-btn" class="process-btn" onclick="startBatchProcess()" disabled>START BATCH FORENSIC MARKING</button>
    </div>

    <script>
        let fileQueue = [];

        function handleFileSelect(event) {
            const files = Array.from(event.target.files).slice(0, 10);
            fileQueue = files.map(f => ({ file: f, status: 'queued', taskId: null }));
            renderQueue();
        }

        // Drag & Drop
        const dropZone = document.getElementById('drop-zone');
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); };
        dropZone.ondragleave = () => dropZone.classList.remove('drag-over');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/')).slice(0, 10);
            fileQueue = files.map(f => ({ file: f, status: 'queued', taskId: null }));
            renderQueue();
        };

        function renderQueue() {
            const container = document.getElementById('batch-container');
            const startBtn = document.getElementById('start-btn');
            
            if (fileQueue.length === 0) {
                container.innerHTML = '';
                startBtn.disabled = true;
                return;
            }

            startBtn.disabled = false;
            container.innerHTML = fileQueue.map((item, idx) => `
                <div class="item-card">
                    <div class="item-info">
                        <span style="font-size: 20px;">🖼️</span>
                        <div>
                            <div class="item-name">${item.file.name}</div>
                            <div class="item-size">${(item.file.size / 1024 / 1024).toFixed(2)} MB</div>
                        </div>
                    </div>
                    <div id="status-${idx}" class="status-badge status-${item.status}">${item.status}</div>
                </div>
                <div class="progress-container"><div id="progress-${idx}" class="progress-bar"></div></div>
            `).join('');
        }

        async function startBatchProcess() {
            const apiKey = document.getElementById('api-key').value;
            const assetId = document.getElementById('asset-id').value;
            const optimize = document.getElementById('optimize').value;
            const startBtn = document.getElementById('start-btn');

            if (!apiKey) return alert("Please enter API Key");

            startBtn.disabled = true;

            for (let i = 0; i < fileQueue.length; i++) {
                const item = fileQueue[i];
                updateStatus(i, 'processing', 30);

                try {
                    const formData = new FormData();
                    formData.append('file', item.file);
                    
                    const url = `/api/v1/embed?partner_asset_id=${encodeURIComponent(assetId)}&optimize=${optimize}`;
                    
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'X-API-KEY': apiKey },
                        body: formData
                    });

                    if (response.ok) {
                        const result = await response.json();
                        fileQueue[i].status = 'completed';
                        fileQueue[i].taskId = result.task_id;
                        updateStatus(i, 'completed', 100);
                    } else {
                        throw new Error("API Failed");
                    }
                } catch (err) {
                    console.error(err);
                    updateStatus(i, 'error', 0);
                }
            }
            
            alert("Batch processing complete!");
        }

        function updateStatus(idx, status, progress) {
            const statusBadge = document.getElementById(`status-${idx}`);
            const progressBar = document.getElementById(`progress-${idx}`);
            
            statusBadge.innerText = status;
            statusBadge.className = `status-badge status-${status}`;
            progressBar.style.width = `${progress}%`;
        }
    </script>
</body>

</html>
